name: Draft custom release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Custom release version (X.Y.Z)
        required: true
        type: string
      notes:
        description: Summary of changes shown in the update dialog
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-custom-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mygo-custom
          persist-credentials: false
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Build signed update
        env:
          MYGO_CUSTOM_VERSION: ${{ steps.version.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
          printf '## %s\n\n%s\n' "$MYGO_CUSTOM_VERSION" "$RELEASE_NOTES" > CHANGELOG.custom.md
          go tool mygo build -platform windows/amd64 -skip-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: |
            build/windows-amd64/update-windows-amd64.json
            build/windows-amd64/mygo-music-custom-*-windows-amd64.tar.gz
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ needs.build.outputs.sha }}
        run: |
          gh release create "custom-v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" --target "$TARGET" --draft --generate-notes
